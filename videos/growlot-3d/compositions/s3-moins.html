<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s3-root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", sans-serif; background: #14101d; }
        #s3-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.045) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 255, 255, 0.045) 2px, transparent 2px); background-size: 96px 96px; }
        #s3-glow { position: absolute; left: 50%; top: 50%; width: 1100px; height: 700px; margin: -350px 0 0 -550px; border-radius: 50%; background: radial-gradient(closest-side, rgba(239, 68, 68, 0.22), rgba(239, 68, 68, 0)); }
        #s3-lead { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 44px; color: #8b8598; }
        #s3-rail { position: absolute; left: 0; top: 0; }
        .s3-pill { position: absolute; display: flex; align-items: center; gap: 26px; padding: 0 44px 0 26px; border-radius: 999px; background: #241f31; border: 2px solid #342d45; color: #ffffff; font-weight: 800; font-size: 60px; letter-spacing: -1.5px; line-height: 1.05; }
        .s3-pill .s3-ar { width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #ef4444; font-size: 54px; }
      </style>

      <div id="s3-root" data-composition-id="s3" data-width="1920" data-height="1080">
        <div id="s3-grid"></div>
        <div id="s3-glow"></div>
        <div id="s3-lead">En gros :</div>
        <div id="s3-rail"></div>
      </div>

      <script>
        (function () {
          var K = Kit, P = K.P, v = K.clock(17.3), el = K.el;
          var tl = gsap.timeline({ paused: true });
          var lead = document.getElementById("s3-lead");
          lead.style.top = P(230, 470) + "px";
          tl.fromTo("#s3-root", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0);
          tl.fromTo(lead, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, v(17.42));

          // trois pilules sur un rail (façon taap.it) : chaque nouvelle vient au centre
          var items = [["moins d'avis", 17.94], ["moins d'abonnés", 18.73], ["moins de clients<br>qui reviennent", 19.76]];
          var W = 820, GAP = 120, H = P(180, 200);
          var rail = document.getElementById("s3-rail");
          items.forEach(function (it, i) {
            var p = el("div", "s3-pill", rail, '<div class="s3-ar">↓</div><div>' + it[0] + "</div>");
            p.style.height = H + "px";
            if (K.V) { p.style.left = "70px"; p.style.width = "940px"; p.style.top = 640 + i * (H + 50) + "px"; }
            else { p.style.width = W + "px"; p.style.left = i * (W + GAP) + "px"; p.style.top = "450px"; }
            var t = v(it[1]) - 0.05;
            tl.fromTo(p, { opacity: 0, scale: 0.6, rotationX: -70 }, { opacity: 1, scale: 1, rotationX: 0, duration: 0.42, ease: "back.out(1.8)" }, t);
            tl.fromTo(p.querySelector(".s3-ar"), { y: -40, rotation: -40 }, { y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" }, t + 0.08);
            if (!K.V) {
              tl.to(rail, { x: 960 - W / 2 - i * (W + GAP), duration: i ? 0.5 : 0.01, ease: "power3.inOut" }, i ? t - 0.12 : 0);
              if (i) tl.to(rail.children[i - 1], { opacity: 0.35, scale: 0.9, duration: 0.35 }, t);
            }
          });
          // tout s'effondre avant le flash
          tl.to(["#s3-rail", "#s3-lead"], { y: 60, opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, v(20.75));

          window.__timelines["s3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
