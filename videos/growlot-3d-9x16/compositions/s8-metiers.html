<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s8-root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", sans-serif; background: #f8f5ef; }
        #s8-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(91, 63, 160, 0.06) 2px, transparent 2px), linear-gradient(90deg, rgba(91, 63, 160, 0.06) 2px, transparent 2px); background-size: 96px 96px; }
        .s8-card { position: absolute; border-radius: 40px; overflow: hidden; color: #1d1530; box-shadow: 0 40px 80px rgba(40, 20, 80, 0.2), 0 10px 24px rgba(40, 20, 80, 0.08); }
        .s8-card .s8-em { position: absolute; left: 0; right: 0; top: 16%; text-align: center; font-size: 170px; line-height: 1; }
        .s8-card .s8-lb { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-weight: 800; font-size: 46px; letter-spacing: -1px; }
        .s8-card .s8-ok { position: absolute; right: 22px; top: 22px; width: 64px; height: 64px; border-radius: 50%; background: #22b35e; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 36px; }
        #s8-pill { position: absolute; display: flex; align-items: center; gap: 22px; padding: 16px 40px 16px 18px; border-radius: 999px; background: #1d1530; color: #ffffff; font-weight: 800; font-size: 48px; white-space: nowrap; }
        #s8-pill .s8-avs { display: flex; }
        #s8-pill .s8-avs i { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #1d1530; margin-left: -18px; display: grid; place-items: center; font-style: normal; font-size: 34px; }
        #s8-pill .s8-avs i:first-child { margin-left: 0; }
        #s8-pill b { color: #fdd643; font-variant-numeric: tabular-nums; }
      </style>

      <div id="s8-root" data-composition-id="s8" data-width="1080" data-height="1920">
        <div id="s8-grid"></div>
        <div class="k-3d" style="perspective: 1900px"><div class="k-cam" id="s8-cam"></div></div>
        <div id="s8-text"></div>
        <div id="s8-pill"><div class="s8-avs"><i style="background:#ffd9c2">🍜</i><i style="background:#fdeccc">🥐</i><i style="background:#e5dcff">✂️</i><i style="background:#d6f5e3">🛍️</i></div><span>Déjà <b id="s8-n">+100</b> commerces</span></div>
      </div>

      <script>
        (function () {
          var K = Kit, P = K.P, v = K.clock(39.4), el = K.el, $ = function (s) { return document.querySelector(s); };
          var tl = gsap.timeline({ paused: true });
          var cam = $("#s8-cam");
          tl.fromTo("#s8-root", { y: P(1080, 1920) }, { y: 0, duration: 0.35, ease: "power3.out" }, 0);

          var items = [["🍜", "Restos", "#ffd9c2", 39.62], ["🥐", "Boulangeries", "#fdeccc", 40.06], ["✂️", "Coiffeurs", "#e5dcff", 40.84], ["🛍️", "Boutiques", "#d6f5e3", 41.45]];
          var CW = P(380, 450), CH = P(470, 470);
          var pos = P([[150, 190, 22], [600, 160, 8], [1050, 160, -8], [1500, 190, -22]], [[70, 380, 10], [560, 380, -10], [70, 900, 10], [560, 900, -10]]);
          var cards = items.map(function (it, i) {
            var c = el("div", "s8-card", cam, '<div class="s8-em">' + it[0] + '</div><div class="s8-lb">' + it[1] + '</div><div class="s8-ok">✓</div>');
            c.style.background = it[2]; c.style.width = CW + "px"; c.style.height = CH + "px";
            c.style.left = pos[i][0] + "px"; c.style.top = pos[i][1] + "px";
            tl.fromTo(c, { rotationY: -120, z: -300, opacity: 0, y: 80 }, { rotationY: P(pos[i][2], 0), rotationX: P(0, pos[i][2] * 0.6), z: 0, opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.4)" }, v(it[3]) - 0.12);
            tl.fromTo(c.querySelector(".s8-em"), { scale: 0.3, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.5)" }, v(it[3]) - 0.02);
            tl.fromTo(c.querySelector(".s8-ok"), { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, v(42.06) + i * 0.08);
            tl.to(c, { y: (i % 2 ? -16 : 16), duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, v(it[3]) + 0.5);
            return c;
          });

          K.say(tl, $("#s8-text"), ["Ça marche #part:partout."], { clock: v, from: 42.0, top: P(720, 1430), size: P(84, 80), ink: true });
          var pill = $("#s8-pill");
          pill.style.left = P("620px", "120px"); pill.style.top = P("880px", "1620px");
          tl.fromTo(pill, { scale: 0, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, v(43.15));
          K.count(tl, $("#s8-n"), 0, 100, v(43.25), 0.9, function (x) { return "+" + Math.round(x); });

          tl.fromTo(cam, { rotationX: 8 }, { rotationX: -4, duration: 5.3, ease: "sine.inOut" }, 0);
          tl.to(["#s8-cam", "#s8-text", "#s8-pill"], { opacity: 0, scale: 0.94, filter: "blur(12px)", duration: 0.3, ease: "power2.in" }, v(44.45));

          window.__timelines["s8"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
