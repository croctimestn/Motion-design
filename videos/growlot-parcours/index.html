    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });

        // halos qui dérivent lentement
        tl.fromTo("#halo-1", { x: 0, y: 0 }, { x: 160, y: 120, duration: 59.5, ease: "sine.inOut" }, 0);
        tl.fromTo("#halo-2", { x: 0, y: 0 }, { x: -200, y: -160, duration: 59.5, ease: "sine.inOut" }, 0);
        tl.fromTo("#halo-3", { x: 0, y: 0 }, { x: 220, y: -90, duration: 59.5, ease: "sine.inOut" }, 0);

        // bandes : elles traversent l'écran en biais, la coupe se fait quand elles couvrent tout
        function wipe(id, t0) {
          document.querySelectorAll(id + " .band").forEach(function (b, i) {
            tl.fromTo(b, { x: 3000, rotation: -16 }, { x: -3200, rotation: -16, duration: 0.8, ease: "power2.inOut" }, t0 + i * 0.05);
          });
        }
        wipe("#wipe-1", 9.95);
        wipe("#wipe-2", 32.5);
        wipe("#wipe-3", 49.3);

        window.__timelines["main"] = tl;
      })();
