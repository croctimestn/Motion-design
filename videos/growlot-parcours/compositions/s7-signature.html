<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s7-root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", sans-serif; color: #1d1530; }
        #s7-bg { position: absolute; inset: 0; background: #f8f5ef; }
        #s7-glow { position: absolute; left: 90px; top: 380px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(199, 179, 255, 0.55), rgba(199, 179, 255, 0) 65%); }
        #s7-lock { position: absolute; left: 0; right: 0; top: 640px; display: flex; align-items: center; justify-content: center; gap: 30px; }
        #s7-star { width: 190px; height: 227px; }
        #s7-star img { width: 100%; height: 100%; display: block; }
        #s7-name { font-weight: 800; font-size: 150px; letter-spacing: -4px; line-height: 1; }
        #s7-tag { position: absolute; left: 0; right: 0; top: 940px; text-align: center; font-weight: 700; font-size: 56px; color: #a7a1b0; }
        #s7-tag .s7-v { color: #5b3fa0; }
        #s7-tag .k-w { margin: 0 6px; }
        #s7-cta { position: absolute; left: 0; right: 0; top: 1130px; display: flex; justify-content: center; }
        #s7-btn { position: relative; display: flex; align-items: center; gap: 22px; padding: 30px 30px 30px 52px; border-radius: 26px; background: #1d1530; color: #ffffff; font-weight: 800; font-size: 50px; box-shadow: 0 24px 50px rgba(29, 21, 48, 0.3); }
        #s7-btn .s7-arrow { width: 74px; height: 74px; border-radius: 18px; background: #fdd643; color: #1d1530; display: grid; place-items: center; font-size: 40px; }
        #s7-url { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; font-weight: 800; font-size: 48px; color: #5b3fa0; }
        #s7-proof { position: absolute; left: 0; right: 0; top: 1410px; text-align: center; font-weight: 600; font-size: 32px; color: #8f8794; }
        #s7-cur { left: 700px; top: 1200px; }
        #s7-conf { position: absolute; left: 540px; top: 1190px; }
      </style>

      <div id="s7-root" data-composition-id="s7" data-width="1080" data-height="1920">
        <div id="s7-bg"></div>
        <div id="s7-glow"></div>
        <div id="s7-lock">
          <div id="s7-star"><img src="assets/img/growlot-star.png" alt="" /></div>
          <div id="s7-name">Grow Lot</div>
        </div>
        <div id="s7-tag"><span class="k-w">Faites</span><span class="k-w">grandir</span><span class="k-w s7-v">l'engagement.</span></div>
        <div id="s7-conf"></div>
        <div id="s7-cta"><div id="s7-btn">Réservez votre démo<div class="s7-arrow">→</div></div></div>
        <div id="s7-url">grow-lot.com</div>
        <div id="s7-proof">+100 commerces nous font déjà confiance</div>
        <div id="s7-cur" class="k-cursor"><img src="assets/img/cursor.png" alt="" /></div>
      </div>

      <script>
        (function () {
          var v = Kit.clock(53.2);
          var R = document.getElementById("s7-root");
          var tl = gsap.timeline({ paused: true });

          // iris crème qui s'ouvre depuis le centre
          tl.fromTo("#s7-bg", { clipPath: "circle(0px at 540px 900px)" }, { clipPath: "circle(1300px at 540px 900px)", duration: 0.5, ease: "power3.inOut" }, 0);
          tl.fromTo("#s7-glow", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power2.out" }, 0.2);
          tl.fromTo("#s7-star", { scale: 0, rotation: -240 }, { scale: 1, rotation: 0, duration: 0.75, ease: "back.out(1.8)" }, v(52.7));
          tl.fromTo("#s7-name", { x: -50, opacity: 0, filter: "blur(16px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, v(52.85));
          document.querySelectorAll("#s7-tag .k-w").forEach(function (w, i) {
            tl.fromTo(w, { y: 40, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, v([53.45, 53.72, 54.15][i]));
          });
          tl.fromTo("#s7-btn", { scale: 0, rotation: -5 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, v(54.95));
          tl.fromTo("#s7-cur", { x: 260, y: 380, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, v(55.05));
          tl.to("#s7-btn", { keyframes: [{ scale: 0.93, duration: 0.08 }, { scale: 1.05, duration: 0.12 }, { scale: 1, duration: 0.15 }] }, v(55.62));
          Kit.tap(tl, R, 730, 1210, v(55.62));
          Kit.confetti(tl, document.getElementById("s7-conf"), { x: 0, y: 0, n: 56, t: v(55.66), seed: 77, spread: 1200, up: 760, fall: 1300 });
          tl.fromTo("#s7-url", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, v(55.9));
          tl.fromTo("#s7-proof", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, v(56.15));
          tl.to("#s7-star", { keyframes: [{ scaleY: 0.86, scaleX: 1.08, duration: 0.1 }, { scaleY: 1.06, scaleX: 0.96, duration: 0.12 }, { scaleY: 1, scaleX: 1, duration: 0.14 }], transformOrigin: "50% 100%" }, v(56.9));
          tl.to("#s7-cur", { x: 200, y: 260, opacity: 0, duration: 0.5, ease: "power2.in" }, v(57.2));

          window.__timelines["s7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
