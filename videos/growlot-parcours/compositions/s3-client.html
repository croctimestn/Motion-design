        (function () {

          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById(id); };

          // vues : entrée en glissant depuis la droite
          function show(id, t) { tl.fromTo("#" + id, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.34, ease: "power3.out" }, t); }
          function hide(id, t) { tl.to("#" + id, { x: -90, opacity: 0, duration: 0.26, ease: "power2.in" }, t); }

          // étiquette de section

          // 1. scan en caisse (photo)

          tl.fromTo("#s3-photo img", { scale: 1.12 }, { scale: 1, duration: 2.2, ease: "power2.out" }, 0);
          Kit.headline(tl, R, ["Il scanne le QR code", "~en caisse."], { clock: v, from: 14.85, out: 16.3, top: 190 });
          tl.to("#s3-photo", { opacity: 0, scale: 1.08, filter: "blur(18px)", duration: 0.45, ease: "power2.in" }, v(16.3));

          // 2. inscription en un clic
          tl.fromTo("#s3-phone", { y: 1500, rotation: 6 }, { y: 0, rotation: 0, duration: 0.6, ease: "power3.out" }, v(16.25));
          show("s3-v1", v(16.3));
          Kit.headline(tl, R, ["Il s'inscrit en un clic.", "~Sans appli à télécharger."], { clock: v, from: 16.45, out: 19.0, top: 190 });
          Kit.type(tl, $("s3-mail-t"), "lea.martin@email.fr", v(16.62), 30);
          tl.to("#s3-send", { keyframes: [{ scale: 0.94, duration: 0.08 }, { scale: 1, duration: 0.14 }] }, v(17.3));
          Kit.tap(tl, $("s3-v1"), 280, 932, v(17.3));
          hide("s3-v1", v(17.5));
          show("s3-v2", v(17.62));
          tl.fromTo("#s3-okc", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, v(17.62));
          Kit.confetti(tl, $("s3-conf-in"), { x: 0, y: 0, n: 30, t: v(17.75), seed: 3, spread: 560, up: 380, fall: 700 });
          tl.fromTo("#s3-noapp", { x: 200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, v(17.85));
          tl.to("#s3-noapp", { x: 200, opacity: 0, duration: 0.3, ease: "power2.in" }, v(19.0));

          // 3. hub de jeux, choix de la roue
          hide("s3-v2", v(19.05));
          show("s3-v3", v(19.15));
          document.querySelectorAll("#s3-v3 .s3-game").forEach(function (g, i) {
