<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s1-root { position: absolute; inset: 0; overflow: hidden; background: #0e0c14; font-family: "Poppins", sans-serif; color: #ffffff; }
        #s1-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.035) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 2px, transparent 2px); background-size: 90px 90px; }
        #s1-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(91, 63, 160, 0.22), rgba(14, 12, 20, 0) 55%), radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.6) 100%); }
        .s1-card { position: absolute; left: 90px; width: 900px; border-radius: 32px; background: #1a1724; border: 2px solid #2a2638; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45); }
        .s1-biz { display: flex; align-items: center; gap: 34px; padding: 40px 44px; }
        .s1-logo { width: 150px; height: 150px; border-radius: 28px; overflow: hidden; flex: none; display: grid; place-items: center; }
        .s1-logo img { width: 100%; height: 100%; display: block; }
        .s1-name { font-weight: 800; font-size: 54px; line-height: 1.1; }
        .s1-meta { font-weight: 500; font-size: 30px; color: #8b8598; margin-top: 4px; }
        .s1-rate { display: flex; align-items: center; gap: 14px; margin-top: 12px; font-weight: 700; font-size: 38px; }
        .s1-rate .k-stars { gap: 4px; }
        .s1-rate .s1-n { font-weight: 500; font-size: 26px; color: #8b8598; }
        #s1-wokki { top: 720px; }
        #s1-sushi { top: 1110px; border-color: #b5843a; background: linear-gradient(135deg, #2a2216, #1a1724 60%); }
        #s1-badge { position: absolute; right: 34px; top: 30px; padding: 8px 20px; border-radius: 12px; background: #fdd643; color: #1d1530; font-weight: 800; font-size: 24px; }
        #s1-sushi-ic { background: linear-gradient(135deg, #ff7a59, #e8473a); font-size: 64px; }
        .s1-heart { position: absolute; width: 46px; height: 46px; }
        .s1-heart svg { width: 100%; height: 100%; display: block; }

        #s1-avis { top: 600px; padding: 44px 48px; }
        .s1-head { display: flex; align-items: center; gap: 18px; font-weight: 700; font-size: 34px; }
        .s1-head .s1-sub { margin-left: auto; font-weight: 500; font-size: 24px; color: #8b8598; }
        .s1-g { width: 54px; height: 54px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; font-weight: 800; font-size: 32px; color: #1a73e8; }
        #s1-big { display: flex; align-items: center; gap: 30px; margin-top: 18px; }
        #s1-num { font-weight: 800; font-size: 230px; line-height: 1; letter-spacing: -6px; }
        #s1-zero { font-weight: 700; font-size: 32px; color: #ef4444; margin-top: 10px; }
        #s1-insta { top: 1040px; padding: 40px 48px 44px; }
        .s1-ig { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(45deg, #f9ce34, #ee2a7b 55%, #6228d7); }
        #s1-ekg { position: relative; margin-top: 28px; height: 330px; border-radius: 20px; background: #110f18; border: 2px solid #2a2638; overflow: hidden; }
        #s1-ekg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        #s1-flat-lbl { position: absolute; right: 22px; top: 16px; font-weight: 800; font-size: 22px; letter-spacing: 2px; color: #ef4444; opacity: 0; }

        #s1-ventes { top: 620px; padding: 44px 48px 24px; }
        .s1-row { display: flex; align-items: center; gap: 28px; padding: 34px 0; border-top: 2px solid #2a2638; }
        .s1-av { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 34px; flex: none; }
        .s1-who b { display: block; font-weight: 700; font-size: 38px; }
        .s1-who span { display: block; font-weight: 500; font-size: 28px; color: #8b8598; }
        .s1-time { margin-left: auto; font-weight: 600; font-size: 30px; color: #8b8598; }
        .s1-never { position: absolute; right: 48px; padding: 10px 22px; border-radius: 14px; background: rgba(239, 68, 68, 0.16); border: 2px solid rgba(239, 68, 68, 0.5); color: #ff6b6b; font-weight: 800; font-size: 28px; opacity: 0; }
      </style>

      <div id="s1-root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-grid"></div>
        <div id="s1-vig"></div>

        <!-- A : la fiche Google face au concurrent -->
        <div id="s1-wokki" class="s1-card">
          <div class="s1-biz">
            <div class="s1-logo"><img src="assets/img/wokki-badge.png" alt="" /></div>
            <div>
              <div class="s1-name">Wokki</div>
              <div class="s1-meta">Restaurant · 0,4 km</div>
              <div class="s1-rate"><span>3,9</span><span id="s1-stars-w"></span><span class="s1-n">(12 avis)</span></div>
            </div>
          </div>
        </div>
        <div id="s1-sushi" class="s1-card">
          <div id="s1-badge">N°1 du quartier</div>
          <div class="s1-biz">
            <div id="s1-sushi-ic" class="s1-logo">🍣</div>
            <div>
              <div class="s1-name">Sushi Bar</div>
              <div class="s1-meta">Restaurant · 0,4 km</div>
              <div class="s1-rate"><span>4,8</span><span id="s1-stars-s"></span><span class="s1-n">(486 avis)</span></div>
            </div>
          </div>
        </div>
        <div id="s1-hearts"></div>

        <!-- B : avis bloqués et Instagram à plat -->
        <div id="s1-avis" class="s1-card">
          <div class="s1-head"><div class="s1-g">G</div>Avis Google<span class="s1-sub">Dernier avis : il y a 4 mois</span></div>
          <div id="s1-big">
            <div id="s1-num">12</div>
            <div>
              <div id="s1-stars-a"></div>
              <div id="s1-zero">+0 ce mois-ci</div>
            </div>
          </div>
        </div>
        <div id="s1-insta" class="s1-card">
          <div class="s1-head"><div class="s1-ig"></div>wokki_france<span class="s1-sub">149 abonnés · 3 publications</span></div>
          <div id="s1-ekg">
            <svg viewBox="0 0 812 220" preserveAspectRatio="none">
              <path id="s1-beat" d="M0 120 H120 L140 120 L160 40 L182 196 L204 92 L222 120 H330 L350 120 L370 40 L392 196 L414 92 L432 120 H540 L560 120 L580 40 L602 196 L624 92 L642 120 H812" fill="none" stroke="#22c55e" stroke-width="6" stroke-linejoin="round" />
              <path id="s1-flat" d="M0 120 H812" fill="none" stroke="#ef4444" stroke-width="6" />
            </svg>
            <div id="s1-flat-lbl">ENCÉPHALOGRAMME PLAT</div>
          </div>
        </div>

        <!-- C : les ventes du jour, personne ne revient -->
        <div id="s1-ventes" class="s1-card">
          <div class="s1-head"><span style="width: 18px; height: 18px; border-radius: 50%; background: #22c55e"></span>Ventes du jour<span class="s1-sub">72,80 €</span></div>
          <div class="s1-row"><div class="s1-av" style="background: #6f52b8">JM</div><div class="s1-who"><b>Julien M.</b><span>Achat · 18,50 €</span></div><div class="s1-time">12:04</div><div class="s1-never">Jamais revenu</div></div>
          <div class="s1-row"><div class="s1-av" style="background: #eb5d3b">AL</div><div class="s1-who"><b>Amélie L.</b><span>Achat · 12,90 €</span></div><div class="s1-time">12:11</div><div class="s1-never">Jamais revenue</div></div>
          <div class="s1-row"><div class="s1-av" style="background: #3a3448">SK</div><div class="s1-who"><b>Samir K.</b><span>Achat · 24,00 €</span></div><div class="s1-time">12:26</div><div class="s1-never">Jamais revenu</div></div>
          <div class="s1-row"><div class="s1-av" style="background: #a56be0">CD</div><div class="s1-who"><b>Chloé D.</b><span>Achat · 17,40 €</span></div><div class="s1-time">12:38</div><div class="s1-never">Jamais revenue</div></div>
        </div>
      </div>

      <script>
        (function () {
          var v = Kit.clock(0);
          var R = document.getElementById("s1-root");
          var tl = gsap.timeline({ paused: true });

          Kit.stars(document.getElementById("s1-stars-w"), 36).on.forEach(function (s, i) { s.style.opacity = i < 4 ? 1 : 0; });
          Kit.stars(document.getElementById("s1-stars-s"), 36);
          var sa = Kit.stars(document.getElementById("s1-stars-a"), 64);
          sa.on.forEach(function (s, i) { s.style.opacity = i < 3 ? 1 : 0; });

          // A
          Kit.headline(tl, R, ["Vos clients adorent votre commerce…", "~mais en ligne, personne ne le sait."], { clock: v, from: 0, out: 4.74, dark: true });
          tl.fromTo("#s1-wokki", { y: 80, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, v(0.2));
          var hearts = document.getElementById("s1-hearts");
          var r = Kit.rng(11);
          for (var i = 0; i < 9; i++) {
            var h = Kit.el("div", "s1-heart", hearts, '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8 3.2 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.5 0 5.8 3.5 4.3 7.2C19.5 16.4 12 21 12 21z" fill="' + ["#eb5d3b", "#c7b3ff", "#fdd643"][i % 3] + '"/></svg>');
            h.style.left = 160 + r() * 520 + "px";
            h.style.top = "720px";
            tl.fromTo(h, { y: 0, opacity: 0, scale: 0.5 }, { y: -170 - r() * 120, opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, v(0.8) + i * 0.09);
            tl.to(h, { opacity: 0, duration: 0.4 }, v(0.8) + i * 0.09 + 0.75);
          }
          tl.fromTo("#s1-sushi", { y: 120, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, v(2.96));
          tl.fromTo("#s1-badge", { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.5)" }, v(3.3));
          tl.to("#s1-wokki", { opacity: 0.45, filter: "grayscale(1)", scale: 0.96, duration: 0.5, ease: "power2.out" }, v(3.84));
          tl.to(["#s1-wokki", "#s1-sushi"], { y: -260, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.in", stagger: 0.05 }, v(4.8));

          // B
          Kit.headline(tl, R, ["Douze avis Google.", "~Un Instagram à plat."], { clock: v, from: 5.0, out: 7.36, dark: true });
          tl.fromTo("#s1-avis", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, v(4.95));
          tl.fromTo("#s1-num", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, v(5.05));
          tl.to("#s1-num", { keyframes: [{ x: -6, duration: 0.05 }, { x: 6, duration: 0.05 }, { x: -3, duration: 0.05 }, { x: 0, duration: 0.05 }] }, v(5.6));
          tl.fromTo("#s1-insta", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, v(6.1));
          tl.fromTo("#s1-beat", { strokeDasharray: 1400, strokeDashoffset: 1400 }, { strokeDashoffset: 0, duration: 0.9, ease: "none" }, v(6.2));
          tl.fromTo("#s1-flat", { opacity: 0 }, { opacity: 1, duration: 0.12 }, v(7.04));
          tl.to("#s1-beat", { opacity: 0, duration: 0.12 }, v(7.04));
          tl.fromTo("#s1-flat-lbl", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3 }, v(7.1));
          tl.to(["#s1-avis", "#s1-insta"], { y: -260, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.in", stagger: 0.05 }, v(7.4));

          // C
          Kit.headline(tl, R, ["Et des clients qui ne", "reviennent !JAMAIS."], { clock: v, from: 7.5, dark: true });
          tl.fromTo("#s1-ventes", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, v(7.55));
          document.querySelectorAll("#s1-ventes .s1-row").forEach(function (row, i) {
            tl.fromTo(row, { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, v(7.75) + i * 0.16);
            tl.to(row.querySelector(".s1-time"), { opacity: 0, duration: 0.1 }, v(9.2) + i * 0.08);
            tl.fromTo(row.querySelector(".s1-never"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, v(9.2) + i * 0.08);
            tl.to(row.querySelector(".s1-av"), { filter: "grayscale(1)", opacity: 0.6, duration: 0.3 }, v(9.2) + i * 0.08);
          });
          tl.to("#s1-ventes", { keyframes: [{ x: -10, duration: 0.05 }, { x: 10, duration: 0.05 }, { x: -5, duration: 0.05 }, { x: 0, duration: 0.05 }] }, v(9.5));

          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
