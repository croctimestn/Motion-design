<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Grow Lot — Multi-Game Configuration</title>
<link rel="stylesheet" href="/engine/gl.css">
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/engine/motion.js"></script>
<style>
  .window { height: 1240px; }
  .page { position: relative; padding-bottom: 0; }
  .muted { color: var(--muted); }
  .topbar .back { margin-right: auto; display: flex; align-items: center; gap: 8px; color: var(--violet-600); font-weight: 600; font-size: 16px; }
  #screens { position: relative; height: 1100px; }
  .scr { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
  #s-hub { opacity: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font-size: 15px; font-weight: 600; border: 1px solid var(--line); background: #fff; color: var(--ink); white-space: nowrap; }
  .btn.pri { background: var(--violet-600); color: #fff; border-color: var(--violet-600); }
  .btn.sm { padding: 7px 12px; font-size: 14px; }
  .lbl { font-size: 14.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 7px; }
  .inp { position: relative; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #dedbe8; background: #fff; font-size: 15.5px; color: var(--ink); white-space: nowrap; overflow: hidden; }
  .inp .ph { color: #a6a2b8; }
  .inp .t:empty + .ph { display: inline; }
  .inp .t:not(:empty) + .ph { display: none; }
  .inp.focus { border-color: var(--violet-500); box-shadow: 0 0 0 3px rgba(124,85,219,.15); }
  .ic-box { width: 40px; height: 40px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--violet-100); color: var(--violet-600); font-size: 19px; }
  .sw { position: relative; display: inline-block; width: 46px; height: 26px; border-radius: 99px; background: #e4e1ec; flex: none; }
  .sw i { position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .sw.on { background: #7c55db; }
  .sw.on i { transform: translateX(20px); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 700; }
  .pill.ok { background: #dcfce7; color: #15803d; }
  .pill.off { background: #f1f0f5; color: var(--muted); }
  .pill.warn { background: #fee2e2; color: #dc2626; }
  .swapb { position: relative; display: inline-grid; }
  .swapb > * { grid-area: 1 / 1; }
  .crumb { position: relative; z-index: 4; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; }
  .crumb .sep { width: 1px; height: 24px; background: var(--line); }
  .crumb b { font-size: 16px; }
  .crumb .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .sec-t { font-size: 20px; font-weight: 700; }
  .sec-d { margin-top: 4px; font-size: 15px; color: var(--muted); }

  /* hub */
  .hero { position: relative; height: 236px; padding: 28px 30px; overflow: hidden; }
  .hero h1 { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 750; letter-spacing: -.02em; }
  .hero h1 .ico { color: var(--violet-500); font-size: 22px; }
  .hero .sub { margin-top: 8px; width: 520px; color: var(--muted); font-size: 15.5px; line-height: 1.45; }
  .hstats { display: flex; gap: 14px; margin-top: 18px; }
  .hstat { display: flex; align-items: center; gap: 14px; width: 210px; height: 70px; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px; }
  .hstat b { display: block; font-size: 22px; font-weight: 750; }
  .hstat small { font-size: 13px; color: var(--muted); }
  #hero-art { position: absolute; right: 200px; top: 0; height: 236px; }
  .qrcard { position: absolute; right: 28px; top: 20px; width: 150px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: #fff; text-align: center; }
  .qrcard .dl { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--violet-600); }
  .hub-grid { display: grid; grid-template-columns: 1fr 400px; gap: 20px; margin-top: 20px; }
  .hcard { padding: 20px 22px; }
  .hcard .hd { display: flex; align-items: center; gap: 12px; }
  .hcard .hd b { display: block; font-size: 17px; }
  .hcard .hd small { font-size: 13.5px; color: var(--muted); }

  .games { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 16px; }
  .game { position: relative; text-align: center; }
  .game .th { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #efebfa; }
  .game .th img { position: absolute; left: -4%; top: -4%; width: 108%; height: 108%; }
  .game .nm { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 8px; font-size: 14.5px; font-weight: 650; }
  .game .tg { position: absolute; right: 8px; top: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .minirow { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; margin-top: 8px; border-radius: 9px; border: 1px solid var(--line); font-size: 14.5px; }
  .socials { display: flex; gap: 10px; margin-top: 14px; }
  .soc { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; background: #fff; }

  .stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }

  .stat4 div .ico { display: block; margin: 0 auto 4px; font-size: 16px; }

  /* lots */
  .catalog { padding: 22px 24px; min-height: 420px; }
  .lots { display: flex; gap: 16px; margin-top: 18px; }
  .lot { position: relative; width: 210px; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; background: #fff; }
  .lot .im { height: 130px; background: #f4f0ff; display: grid; place-items: center; }

  .lot .bd { padding: 12px 14px; }

  .addlot { width: 210px; height: 236px; border: 2px dashed var(--violet-300); border-radius: 16px; display: grid; place-items: center; text-align: center; color: var(--violet-700); font-weight: 650; }
  .addlot .pl { width: 50px; height: 50px; margin: 0 auto 8px; border-radius: 50%; background: var(--violet-100); display: grid; place-items: center; font-size: 22px; }
  #shade { position: absolute; inset: 0; background: rgba(22,16,44,.5); opacity: 0; z-index: 20; border-radius: 26px; }
  #drawer { position: absolute; right: 0; top: 0; width: 520px; height: 100%; z-index: 21; padding: 26px 28px; background: #fff; box-shadow: -30px 0 60px -20px rgba(10,5,30,.4); }
  #drawer h3 { font-size: 21px; font-weight: 750; }

  .imgbox > * { position: absolute; }
  .dfield { margin-top: 14px; }
  .twobtn { display: grid; gap: 8px; margin-top: 12px; }
  .twobtn .btn.ai { background: var(--violet-100); color: var(--violet-700); border-color: transparent; }
  .cond { margin-top: 16px; padding: 14px; border-radius: 12px; background: #f8f7fb; border: 1px solid var(--line); }
  .ctabs { display: flex; gap: 8px; margin-top: 10px; }
  .ctabs span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .cprev { position: relative; height: 44px; margin-top: 10px; padding: 10px 12px; border-radius: 9px; background: #fff; border: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
  .cprev span { position: absolute; left: 12px; top: 12px; opacity: 0; }
  #aimodal { position: absolute; left: 470px; top: 300px; width: 520px; z-index: 23; padding: 22px; border-radius: 16px; background: #fff; box-shadow: 0 40px 80px -30px rgba(10,5,30,.6); opacity: 0; }
  #shade2 { position: absolute; inset: 0; background: rgba(22,16,44,.45); opacity: 0; z-index: 22; border-radius: 26px; }
  .cost { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: #fff7ed; color: #c2410c; font-size: 13.5px; font-weight: 600; }
  .warnbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; border: 1px solid #fecaca; background: #fef2f2; color: #dc2626; font-size: 14px; font-weight: 600; }

  /* apparence */
  .look { display: grid; grid-template-columns: 1fr 420px; gap: 20px; margin-top: 16px; }
  .themes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 10px; }
  .th-c { position: relative; border-radius: 12px; border: 1.5px solid var(--line); padding: 10px 10px 6px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: #fff; }
  .th-c .sw2 { height: 40px; border-radius: 8px; padding: 8px; text-align: left; }
  .th-c .sw2 i { display: block; height: 6px; width: 60%; border-radius: 4px; margin-bottom: 5px; }
  .th-c .sw2 em { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; }
  .th-c .sel { position: absolute; inset: -2px; border-radius: 13px; border: 2.5px solid var(--violet-600); opacity: 0; }
  .mycols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .mycol { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
  .mycol i { width: 30px; height: 30px; border-radius: 8px; flex: none; }
  .mycol b { display: block; font-size: 14px; }
  .mycol small { font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--muted); }

  /* téléphones */
  .phone { position: relative; width: 340px; height: 700px; border-radius: 54px; background: #17141f; padding: 11px; box-shadow: 0 40px 80px -30px rgba(40,20,90,.55), inset 0 0 0 2px #3a3646; }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #fff; }
  .phone .island { position: absolute; left: 50%; top: 11px; width: 100px; height: 30px; margin-left: -50px; border-radius: 20px; background: #000; z-index: 5; }
  .hubp { position: absolute; inset: 0; padding: 56px 20px 0; background: var(--hb, #1d1640); color: var(--hf, #fff); }
  .hubp .top { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .hubp .top img { width: 30px; height: 30px; border-radius: 50%; }
  .hubp h4 { margin-top: 20px; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  .hubp p { margin-top: 8px; font-size: 13.5px; opacity: .75; }
  .hubp .blk { margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--hc, rgba(255,255,255,.08)); }
  .hubp .blk small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--ha, #fdd643); }
  .hubp .blk b { display: block; margin-top: 3px; font-size: 15px; }
  .hubp .cta { margin-top: 14px; padding: 13px; border-radius: 14px; background: var(--ha, #fdd643); color: #1d1a2e; font-weight: 800; text-align: center; }
  .hubp .gms { display: flex; gap: 8px; margin-top: 10px; }
  .hubp .gms img { width: 62px; height: 62px; border-radius: 12px; }

  /* parcours */
  .cta-wrap { display: grid; grid-template-columns: 64px 1fr 300px; gap: 16px; margin-top: 16px; height: 900px; }
  .palette { padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .palette .soc { width: 44px; height: 44px; border-radius: 12px; }
  .canvas { position: relative; padding: 20px; background-image: radial-gradient(#e6e2f2 1.2px, transparent 1.2px); background-size: 18px 18px; }
  .pw { margin: 0 auto 14px; width: 130px; padding: 6px 12px; border-radius: 99px; background: #1d1a2e; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-align: center; }
  .stepc { position: relative; width: 460px; margin: 0 auto 16px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: #fff; box-shadow: 0 6px 18px -12px rgba(40,20,90,.3); }
  .stepc .h { display: flex; align-items: center; gap: 10px; }
  .stepc .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--violet-100); color: var(--violet-700); font-weight: 750; font-size: 13px; }
  .stepc .h b { font-size: 15.5px; }
  .stepc .h small { display: block; font-size: 12.5px; color: var(--muted); }
  .stepc .gm { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 10px; background: #f6f3ff; font-size: 12.5px; font-weight: 700; color: var(--violet-700); }
  .stepc .gm img { width: 28px; height: 28px; border-radius: 7px; }
  .slot { position: relative; margin-top: 10px; height: 50px; border-radius: 12px; border: 1.5px dashed var(--violet-300); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--violet-600); }
  .act { position: absolute; inset: -1.5px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-size: 14.5px; font-weight: 600; color: var(--ink); opacity: 0; }
  .act svg { width: 22px; height: 22px; }
  .act .pill { margin-left: auto; }
  .stepc.loop { border: 1.5px solid var(--violet-400); }
  .ghost { position: absolute; z-index: 30; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; box-shadow: 0 14px 30px -10px rgba(40,20,90,.5); opacity: 0; }
  .ghost svg { width: 22px; height: 22px; }
  .aset { padding: 18px; }

  /* connexion */
  .secw { display: grid; grid-template-columns: 230px 1fr; margin-top: 16px; min-height: 760px; }
  .secnav { padding: 22px 16px; border-right: 1px solid var(--line); }
  .secnav small { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
  .secnav h4 { margin: 4px 0 16px; font-size: 18px; }
  .sn { position: relative; display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; margin-bottom: 6px; }
  .sn em { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #f1f0f5; font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .sn b { display: block; font-size: 14.5px; }
  .sn small { letter-spacing: 0; font-weight: 500; font-size: 12px; }
  .sn .hl { position: absolute; inset: 0; border-radius: 12px; border: 1px solid var(--line); background: #faf8ff; z-index: -1; opacity: 0; }
  .secbody { position: relative; padding: 24px 28px; }
  .spane { position: absolute; left: 28px; right: 28px; top: 24px; opacity: 0; }
  #sp1 { opacity: 1; }
  .meth { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .mcard { position: relative; padding: 18px; border-radius: 16px; border: 1.5px solid var(--line); }
  .mcard b { display: block; margin-top: 12px; font-size: 17px; }
  .mcard small { display: block; margin-top: 4px; font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .mcard .ck { position: absolute; right: 14px; top: 14px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #d6d2e2; display: grid; place-items: center; color: #fff; font-size: 14px; }
  .mcard .reco { position: absolute; right: 14px; bottom: 14px; }
  .chan { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 10px; border-radius: 12px; border: 1px solid var(--line); font-size: 14.5px; }
  .chan .cb { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid #c9c6d6; display: grid; place-items: center; color: #fff; font-size: 13px; }
  .chan .cb.on { background: var(--violet-600); border-color: var(--violet-600); }
  .legal { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .okbar { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; font-weight: 600; font-size: 14.5px; }
  .prot { display: flex; gap: 14px; align-items: flex-start; padding: 16px; margin-top: 12px; border-radius: 14px; border: 1px solid var(--line); }
  .prot .ic-box { width: 38px; height: 38px; }
  .prot b { display: block; font-size: 15.5px; }
  .prot small { display: block; margin-top: 3px; font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .prot .val { margin-left: auto; text-align: right; }
  .prot .val em { display: block; margin-top: 6px; font-style: normal; font-size: 13px; font-weight: 700; color: var(--violet-700); }
  .defaut { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 9px 14px; border-radius: 99px; background: #dcfce7; color: #15803d; font-weight: 700; font-size: 14px; opacity: 0; }
  .lockscr { position: absolute; inset: 0; background: #faf9fd; }
  .lockscr .c { position: absolute; left: 0; right: 0; top: 150px; text-align: center; }

  /* qr */
  .qrw { display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-top: 16px; }
  .modu { display: flex; align-items: center; gap: 14px; padding: 16px; margin-top: 12px; border-radius: 14px; background: #f8f7fb; }
  .modu b { display: block; font-size: 16px; }
  .modu small { font-size: 13.5px; color: var(--muted); }
  .modu .sw { margin-left: auto; }
  .url { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #f8f7fb; font-family: ui-monospace, monospace; font-size: 14px; }
  .qrbig { width: 210px; margin: 14px auto 0; padding: 14px; border-radius: 18px; border: 1.5px solid var(--violet-300); background: #fff; }

  .toast { position: absolute; right: 30px; top: 92px; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 12px; background: #fff; border: 1px solid var(--line); box-shadow: 0 20px 44px -16px rgba(40,20,100,.35); font-size: 15.5px; font-weight: 600; opacity: 0; }
  .toast .ok { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #16a34a; color: #fff; font-size: 15px; }

  /* scène « le moteur du jeu » */
  .duo { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; gap: 170px; }
  .feat { width: 560px; height: 500px; padding: 32px 34px; border-radius: 28px; background: #fffbee; color: var(--ink); box-shadow: 0 40px 80px -30px rgba(20,10,60,.6); opacity: 0; }
  .feat .k { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 99px; background: #654a98; color: #fffbee; font-size: 20px; font-weight: 700; }
  .feat h3 { margin-top: 16px; font-size: 38px; font-weight: 700; letter-spacing: -.02em; }
  .feat .vis { position: relative; height: 230px; margin-top: 10px; }
  .feat .chips { display: flex; gap: 12px; margin-top: 6px; }
  .feat .chips span { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 14px; background: #fff; box-shadow: 0 8px 20px -12px rgba(40,20,90,.45); font-size: 20px; font-weight: 600; opacity: 0; }
  .feat .chips span .ico { color: #654a98; }
  .bigstars { position: absolute; left: 0; top: 40px; font-size: 64px; letter-spacing: 6px; color: #fdd643; text-shadow: 0 4px 0 #e0b525; }
  .bigstars span { display: inline-block; }
  .loopar { position: absolute; left: 50%; top: 470px; width: 220px; margin-left: -110px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world"><div class="window" id="app"></div></div>
  <div id="hud"></div>
</div>

<script>
(async () => {
  // le moteur remplace <i data-icon> par le SVG (sans garder la classe) : une classe passe par un <span>
  const icon = (n, cls = '') => (cls ? `<span class="${cls}"><i data-icon="${n}"></i></span>` : `<i data-icon="${n}"></i>`);
  const LOGO = 'img/sqp-logo.png';

  tl.to('#shade', { opacity: 0, duration: 0.3 }, cond.cues.creez + 0.2);
  tl.set('#lot0', { display: 'block' }, cond.cues.creez + 0.3);
  tl.fromTo('#lot0', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, cond.cues.creez + 0.3);
  swapTo('#w0', '#w1', cond.cues.creez + 0.35, 0.15);
  M.camera('#s-lots', cond.cues.creez + 0.15, { pad: 40, dy: -120, dur: 0.7 });
  // publier
  clickOn('#pub-lots', cond.cues.publiez + 0.1, { dur: 0.4 });
  toast('#t-pub', cond.cues.publiez + 0.25, cond.cues.conseil + 0.2);
  // notre conseil : 4 lots (25 % chacun = 100 %)
  M.cursorHide(cond.cues.conseil - 0.1);
  $$('.lot.extra').forEach((l, i) => {
    tl.set(l, { display: 'block' }, cond.cues.conseil + 0.15 + i * 0.25);
    tl.fromTo(l, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, cond.cues.conseil + 0.15 + i * 0.25);
  });
  M.sfx('pop', cond.cues.conseil + 0.15, 0.4);
  tl.to('#addlot', { opacity: 0, duration: 0.2 }, cond.cues.conseil + 0.1);
  tl.to('#warn', { backgroundColor: '#f0fdf4', borderColor: '#bbf7d0', color: '#15803d', duration: 0.3 }, cond.cues.conseil + 0.9);
  textAt('#w1', 'Le total doit être 100 %. Actuellement : 25 %', [[cond.cues.conseil + 0.9, 'Total des probabilités : 100 % ✓']]);
  M.tip('#lotx1', cond.cues.conseil + 0.95, { title: 'Notre conseil : 4 lots', text: 'Le rendu dans les jeux est bien plus attractif.', side: 'bottom', gap: 20, until: cond.end - 0.1 });

  // ================================================================ 05 — L'apparence
  toHub(look.start + 0.05);
  M.camera('#c-look', look.start + 0.1, { pad: 120, dur: 0.6 });
  goFromHub('#go-look', '#s-look', look.start + 0.75);
  M.camera('#s-look', look.start + 1.05, { pad: 30, dy: -20, dur: 0.7 });
  M.spot('#w-themes', look.cues.theme, { pad: 8, dur: 0.25 });
  const themes = {
    1: { '--hb': '#2d1610', '--ha': '#f4a340', '--hf': '#fff', '--hc': 'rgba(255,255,255,.08)' },
    11: { '--hb': '#eef2f6', '--ha': '#1d4ed8', '--hf': '#111827', '--hc': '#ffffff' },
    8: { '--hb': '#e9f7f0', '--ha': '#0f766e', '--hf': '#0f2a20', '--hc': '#ffffff' },
  };
  let selT = 0;
  const pickTheme = (i, at) => {
    clickOn('#th' + i, at, { dur: 0.3, fy: 0.4 });
    tl.to('#ths' + selT, { opacity: 0, duration: 0.15 }, at + 0.02);
    tl.to('#ths' + i, { opacity: 1, duration: 0.15 }, at + 0.02);
    tl.to('#pv-look .hubp', { ...themes[i], duration: 0.4 }, at + 0.05);
    selT = i;
  };
  pickTheme(1, look.cues.theme + 0.3);
  pickTheme(11, look.cues.theme + 0.95);
  M.spot('#w-mycols', look.cues.couleurs - 0.05, { pad: 8, dur: 0.25 });
  clickOn('#mc1', look.cues.couleurs + 0.2, { dur: 0.35 });
  tl.to('#pv-look .hubp', { '--ha': '#eb5d3b', duration: 0.4 }, look.cues.couleurs + 0.3);
  tl.to('#mc1 i', { backgroundColor: '#eb5d3b', duration: 0.4 }, look.cues.couleurs + 0.3);
  textAt('#mc1 small', '#FDD643', [[look.cues.couleurs + 0.45, '#EB5D3B']]);
  M.spot('#w-themes', look.cues.conseil - 0.05, { pad: 8, dur: 0.25 });
  pickTheme(8, look.cues.conseil + 0.3);
  M.tip('#w-themes', look.cues.conseil + 0.4, { title: 'Notre conseil', text: 'Partez d\'un thème déjà créé : harmonieux et lisible.', side: 'bottom', gap: 18, until: look.end - 0.1 });
  M.spotOff(look.end - 0.15);
  M.cursorHide(look.end - 0.2);

  // ================================================================ 06 — Le parcours joueur
  toHub(parc.start + 0.05);
  M.camera('#c-cta', parc.start + 0.1, { pad: 120, dur: 0.6 });
  goFromHub('#go-cta', '#s-cta', parc.start + 0.7);
  M.camera(['#palette', '#step0', '#step2', '#aset'], parc.start + 1.0, { pad: 40, dur: 0.7 });
  gsap.set('#step0, #step1, #step2', { opacity: 0, y: 20 });
  tl.to('#step0, #step1, #step2', { opacity: 1, y: 0, duration: 0.4, stagger: 0.18, ease: 'power3.out' }, parc.cues.visite - 0.2);
  M.spot(['#step0 .gm', '#step1 .gm', '#step2 .gm'], parc.cues.visite + 0.3, { pad: 4, dur: 0.25 });
  M.spot(['#slot0', '#slot1', '#slot2'], parc.cues.action, { pad: 4, dur: 0.25 });
  M.spotOff(parc.cues.avis - 0.3, { dur: 0.2 });
  // glisser-déposer : Google → visite 1, Instagram → visite 2
  const drag = (k, slot, act, at) => {
    const from = M.rect('#pal-' + k);
    const to = M.rect(slot);
    const g = document.createElement('div');
    g.className = 'ghost';
    g.innerHTML = BR[k];
    M.world.appendChild(g);
    gsap.set(g, { x: from.x, y: from.y });
    M.cursorTo('#pal-' + k, at - 0.4, { dur: 0.35 });
    tl.to(g, { opacity: 1, scale: 1.1, duration: 0.15 }, at);
    tl.to(g, { x: to.x + to.w / 2 - 22, y: to.y + 3, duration: 0.6, ease: 'power2.inOut' }, at + 0.1);
    M.cursorTo({ x: to.x + to.w / 2, y: to.y + 28 }, at + 0.1, { dur: 0.6 });
    tl.to(g, { opacity: 0, scale: 0.6, duration: 0.15 }, at + 0.72);
    tl.fromTo(act, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, at + 0.72);
    M.sfx('pop', at + 0.72, 0.4);
  };
  drag('google', '#slot0', '#act0', parc.cues.avis);
  tl.to('#as0', { opacity: 0, duration: 0.2 }, parc.cues.avis + 0.8);
  tl.to('#as1', { opacity: 1, duration: 0.25 }, parc.cues.avis + 0.85);
  drag('insta', '#slot1', '#act1', parc.cues.insta);
  M.spot(['#act0', '#act1', '#aset'], parc.cues.decidez - 0.05, { pad: 6, dur: 0.3 });
  M.tip('#step2', parc.cues.decidez + 0.2, { title: 'Vous décidez', text: 'Quelle action, à quelle visite : avis, abonnés, partages…', side: 'bottom', gap: 110, until: parc.end - 0.1 });
  tl.fromTo('#act2', { opacity: 0 }, { opacity: 1, duration: 0.3 }, parc.cues.decidez + 0.5);
  M.spotOff(parc.end - 0.15);
  M.cursorHide(parc.end - 0.2);

  // ================================================================ 07 — Connexion
  toHub(cnx.start + 0.05);
  M.camera('#c-sec', cnx.start + 0.1, { pad: 120, dur: 0.5 });
  goFromHub('#go-sec', '#s-sec', cnx.start + 0.55);
  M.camera('#s-sec', cnx.start + 0.85, { pad: 30, dur: 0.6 });
  M.spot('#m-magic', cnx.cues.magic, { pad: 6, dur: 0.25 });
  clickOn('#m-magic', cnx.cues.magic + 0.3, { dur: 0.4, fy: 0.3 });
  tl.to('#ck-magic', { backgroundColor: '#7c55db', borderColor: '#7c55db', duration: 0.2 }, cnx.cues.magic + 0.35);
  tl.to('#m-magic', { borderColor: '#9b7cf0', backgroundColor: '#faf8ff', duration: 0.2 }, cnx.cues.magic + 0.35);
  tl.fromTo('#reco', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.5)' }, cnx.cues.magic + 0.5);
  M.spotOff(cnx.cues.scanne - 0.1, { dur: 0.25 });
  M.cursorHide(cnx.cues.scanne);
  tl.fromTo('#sc-qr > div', { boxShadow: '0 0 0 0 rgba(253,214,67,.8)' }, { boxShadow: '0 0 0 18px rgba(253,214,67,0)', duration: 0.6 }, cnx.cues.scanne + 0.1);
  tl.to('#sc-qr', { opacity: 0, duration: 0.2 }, cnx.cues.compte - 0.1);
  tl.fromTo('#sc-ok', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.8)' }, cnx.cues.compte);
  M.sfx('pop', cnx.cues.compte, 0.45);
  M.tip('#ph-sec', cnx.cues.mdp, { title: 'Sans mot de passe', text: 'Le compte est rattaché au téléphone du client.', side: 'left', gap: 20, dy: -60, until: cnx.end - 0.05 });
  M.spotOff(cnx.end - 0.1);

  // ================================================================ 08 — Conformité et protections
  const secTab = (i, prev, at) => {
    clickOn('#sn' + i, at, { dur: 0.35 });
    tl.to(`#sn${prev} .hl`, { opacity: 0, duration: 0.15 }, at + 0.02);
    tl.to(`#sn${i} .hl`, { opacity: 1, duration: 0.15 }, at + 0.02);
    tl.to('#sp' + (prev + 1), { opacity: 0, duration: 0.2 }, at + 0.05);
    tl.fromTo('#sp' + (i + 1), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35 }, at + 0.15);
  };
  secTab(1, 0, prot.cues.conformite - 0.15);
  M.spot('#f-siret', prot.cues.conformite + 0.3, { pad: 6, dur: 0.25 });
  typeAt('#f-siret .t', '123 456 789 00012', prot.cues.conformite + 0.4, 0.6);
  tl.fromTo('#okbar', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3 }, prot.cues.conformite + 1.1);
  M.spotOff(prot.cues.protections - 0.3, { dur: 0.15 });
  secTab(2, 1, prot.cues.protections - 0.1);
  [['#pr0', prot.cues.rejeu], ['#pr1', prot.cues.delai], ['#pr2', prot.cues.duree]].forEach(([s, t]) => M.spot(s, t - 0.05, { pad: 6, dur: 0.25 }));
  M.spotOff(prot.cues.defaut - 0.1, { dur: 0.2 });
  tl.fromTo('#defaut', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2.2)' }, prot.cues.defaut + 0.05);
  M.sfx('pop', prot.cues.defaut + 0.05, 0.4);
  M.tip('#defaut', prot.cues.defaut + 0.3, { title: 'Pas besoin d\'y toucher', text: 'Ces réglages sont déjà optimisés pour vous.', side: 'right', gap: 18, until: prot.end - 0.05, silent: true });
  M.cursorHide(prot.cues.defaut);

  // ================================================================ 09 — Votre QR code
  toHub(qr.start + 0.05);
  M.camera('#hero', qr.start + 0.1, { pad: 60, dur: 0.6 });
  clickOn('#qr-dl', qr.cues.telecharger - 0.1, { dur: 0.4, from: { x: 1300, y: 500 } });
  showScreen('#s-qr', qr.cues.telecharger);
  M.camera('#c-qr', qr.cues.telecharger + 0.2, { pad: 80, dur: 0.8 });
  clickOn('#btn-dl', qr.cues.telecharger + 0.85, { dur: 0.3 });
  toast('#t-dl', qr.cues.telecharger + 1.0, qr.cues.jeux);
  // le QR mène au hub : le téléphone l'affiche
  gsap.set('#ph-hub .hb-card', { opacity: 0, height: 0, marginTop: 0, padding: 0 });
  tl.fromTo('#hubwrap', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, qr.cues.hub);
  M.cursorHide(qr.cues.hub);
  M.camera(['#c-mods', '#ph-hub'], qr.cues.hub - 0.1, { pad: 40, dur: 0.7 });
  M.spot('#mod0', qr.cues.jeux, { pad: 6, dur: 0.25 });
  tl.fromTo('#ph-hub .hb-games', { scale: 1 }, { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1 }, qr.cues.jeux + 0.1);
  M.spot('#mod1', qr.cues.carte - 0.05, { pad: 6, dur: 0.25 });
  clickOn('#msw1', qr.cues.carte + 0.2, { dur: 0.4, from: { x: 900, y: 700 } });
  toggle('msw1', qr.cues.carte + 0.25);
  tl.to('#ph-hub .hb-card', { opacity: 1, height: 'auto', marginTop: 14, padding: 14, duration: 0.45, ease: 'power3.out' }, qr.cues.carte + 0.3);
  M.spot(['#mod0', '#mod1'], qr.cues.deux, { pad: 6, dur: 0.25 });
  M.tip('#mod1', qr.cues.deux + 0.2, { title: 'Jeux, fidélité, ou les deux', text: 'Votre hub s\'adapte à votre offre.', side: 'bottom', gap: 16, until: qr.end + 0.2 });
  M.spotOff(qr.end + 0.1);
  M.cursorHide(qr.end);

  // ================================================================ OUTRO
  M.camera({ x: 1200, y: 640, s: 0.5 }, outro.start + 0.4, { dur: 1.2, whoosh: true });
  const end = M.titleCard(`<div class="logo">${M.logo({ h: 230 })}</div><div class="tagline">Faites grandir l'engagement !</div>`);
  const tEnd = outro.audio.start - 0.6;
  M.sfx('sting', tEnd);
  tl.to(end, { opacity: 1, duration: 0.6, ease: 'power2.out' }, tEnd);
  tl.from(end.querySelector('.logo'), { y: 30, scale: 0.94, duration: 0.8, ease: 'power3.out' }, tEnd + 0.05);
  tl.from(end.querySelector('.gl-icon'), { rotate: -90, scale: 0.4, duration: 1.1, ease: 'back.out(1.7)' }, tEnd + 0.05);
  tl.from(end.querySelector('.tagline'), { opacity: 0, y: 20, duration: 0.6, ease: 'power3.out' }, outro.audio.start);

  M.ready();
})();
</script>
</body>
</html>
