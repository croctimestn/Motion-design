<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Grow Lot — La carte de fidélité Wallet</title>
<link rel="stylesheet" href="/engine/gl.css">
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/engine/motion.js"></script>
<style>
  .window { height: 1800px; }
  .page { position: relative; padding-bottom: 0; }
  .muted { color: var(--muted); }
  .topbar .back { margin-right: auto; display: flex; align-items: center; gap: 8px; color: var(--violet-600); font-weight: 600; font-size: 16px; opacity: 0; }
  #screens { position: relative; height: 1640px; }
  .scr { position: absolute; left: 0; top: 0; width: 100%; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-size: 15.5px; font-weight: 600; border: 1px solid var(--line); background: #fff; color: var(--ink); white-space: nowrap; }
  .btn.pri { background: var(--violet-600); color: #fff; border-color: var(--violet-600); }
  .lbl { font-size: 14.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
  .inp { position: relative; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 10px; border: 1px solid #dedbe8; background: #fff; font-size: 16px; color: var(--ink); white-space: nowrap; overflow: hidden; }
  .inp.area { height: 74px; align-items: flex-start; padding-top: 13px; white-space: normal; }
  .inp .ph { color: #a6a2b8; }
  .inp .t:empty + .ph { display: inline; }
  .inp .t:not(:empty) + .ph { display: none; }
  .inp.focus { border-color: var(--violet-500); box-shadow: 0 0 0 3px rgba(124,85,219,.15); }
  .ic-box { width: 42px; height: 42px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--violet-100); color: var(--violet-600); font-size: 20px; }
  .sec-lbl { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--violet-600); text-transform: uppercase; }
  .sw { position: relative; display: inline-block; width: 46px; height: 26px; border-radius: 99px; background: #e4e1ec; flex: none; }
  .sw i { position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 7px; background: #f1f0f5; color: var(--ink-2); font-size: 13px; font-weight: 600; }

  /* ---------- Grow Labs (hub) ---------- */
  .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 26px; }
  .hcard { height: 226px; padding: 26px 26px; }
  .hcard h3 { display: flex; align-items: center; gap: 14px; font-size: 21px; font-weight: 700; }
  .hcard p { margin-top: 14px; width: 330px; font-size: 15.5px; line-height: 1.45; color: var(--ink-2); }
  .hcard .btn { position: absolute; left: 26px; bottom: 26px; }
  .hcard img { position: absolute; right: 22px; top: 62px; width: 205px; }

  /* ---------- page carte de fidélité ---------- */
  .hero { height: 252px; padding: 30px 32px; overflow: hidden; background: linear-gradient(100deg, #fff 45%, #f6f2ff 100%); }
  .hero h1 { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 750; letter-spacing: -.02em; }
  .hero h1 .ico { color: var(--violet-500); font-size: 24px; }
  .hero .sub { margin-top: 10px; width: 600px; color: var(--muted); font-size: 16px; line-height: 1.5; }
  .hchips { display: flex; gap: 16px; margin-top: 20px; }
  .hchip { position: relative; display: flex; align-items: center; gap: 14px; width: 250px; flex: none; height: 78px; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .hchip small { display: block; font-size: 13.5px; color: var(--muted); }
  .hchip b { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 16px; font-weight: 700; white-space: nowrap; }
  .pill-st { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: #f1f0f5; color: var(--ink-2); }
  .pill-st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .6; }
  .art { position: absolute; right: 0; top: 0; width: 420px; height: 252px; }
  .art img { position: absolute; }
  .qrbox { position: absolute; right: 30px; top: 24px; width: 126px; height: 126px; padding: 8px; border-radius: 14px; background: #fff; box-shadow: 0 8px 24px -10px rgba(60,30,140,.3); }
  .art .apercu { position: absolute; right: 26px; bottom: 26px; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-size: 14.5px; font-weight: 600; color: var(--violet-600); }
  .tabbar { position: relative; z-index: 6; display: flex; align-items: center; gap: 6px; height: 68px; margin-top: 22px; padding: 0 12px; }
  .tab { display: flex; align-items: center; gap: 9px; padding: 10px 14px; white-space: nowrap; border-radius: 10px; font-size: 16px; font-weight: 500; color: var(--ink-2); }
  .tab.on { color: var(--violet-600); font-weight: 600; }
  #tab-uline { position: absolute; bottom: 0; height: 3px; border-radius: 3px; background: var(--violet-500); }
  .tabbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .stat-tg { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-weight: 600; }
  .stat-tg .dot { width: 8px; height: 8px; border-radius: 50%; background: #b8b5c6; }
  .sq { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; border: 1px solid var(--line); font-size: 19px; }
  .sq.pri { background: var(--violet-600); border-color: var(--violet-600); color: #fff; }
  #cfgmenu { position: absolute; top: 60px; width: 250px; padding: 6px; border-radius: 12px; background: #fff; border: 1px solid var(--line); box-shadow: 0 22px 50px -12px rgba(40,20,100,.28); opacity: 0; z-index: 9; }
  #cfgmenu div { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; font-size: 15.5px; font-weight: 500; color: var(--ink-2); }
  #cfgmenu div .ico { font-size: 18px; color: #8a86a0; }
  #content { position: relative; margin-top: 22px; height: 1240px; }
  .pane { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
  #p-dash { opacity: 1; }

  /* dashboard */
  .kgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .kc { height: 132px; padding: 20px; }
  .kc .t { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
  .kc .t .ic-box { width: 34px; height: 34px; font-size: 16px; }
  .kc b { display: block; margin-top: 14px; font-size: 30px; font-weight: 750; }
  .kc small { color: var(--muted); font-size: 13px; }
  .dash-row { display: grid; grid-template-columns: 1fr 400px; gap: 18px; margin-top: 18px; }
  .qa { display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 18px; margin-bottom: 12px; font-weight: 600; }

  /* gains & règles */
  .cardp { padding: 0; }
  .cardp .hd { display: flex; align-items: center; gap: 14px; padding: 20px 24px; border-bottom: 1px solid var(--line); font-size: 19px; font-weight: 700; }
  .cardp .bd { padding: 22px 24px; }
  .lockbox { display: flex; gap: 60px; padding: 18px 20px; border-radius: 12px; background: #f8f7fb; border: 1px solid var(--line); }
  .lockbox small { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
  .lockbox b { display: block; margin-top: 6px; font-size: 16.5px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 20px; }
  .rules-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }

  /* apparence */
  #look-left { width: 770px; display: flex; flex-direction: column; gap: 18px; }
  .lsec { padding: 22px 24px; }
  .lsec .hd { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .lsec .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--violet-100); color: var(--violet-600); font-weight: 700; }
  .lsec .hd b { display: block; font-size: 18px; }
  .lsec .hd small { color: var(--muted); font-size: 14px; }
  .info-grid { display: grid; grid-template-columns: 96px 1fr 1fr; gap: 18px; align-items: start; }
  .logo-box { width: 96px; height: 96px; border-radius: 14px; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .logo-box img { width: 84px; }
  .colors { position: relative; padding: 16px; border-radius: 14px; border: 1px solid var(--line); }
  .colors .hrow { display: flex; gap: 10px; }
  .cbtn { position: relative; flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); }
  .cbtn i { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .cbtn small { display: block; font-size: 12px; color: var(--muted); }
  .cbtn b { position: relative; display: block; font-family: ui-monospace, monospace; font-size: 13.5px; }
  .quick { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  .quick i { width: 30px; height: 30px; border-radius: 50%; }
  .quick span { margin-left: auto; font-size: 13.5px; font-weight: 600; color: var(--violet-600); }
  #dd-code { position: absolute; left: 0; top: 86px; width: 100%; padding: 6px; border-radius: 10px; background: #fff; border: 1px solid var(--line); box-shadow: 0 20px 44px -14px rgba(40,20,100,.3); z-index: 7; opacity: 0; }
  #dd-code div { display: flex; justify-content: space-between; padding: 9px 12px; border-radius: 7px; font-size: 15px; }
  #dd-code .ico { color: var(--violet-600); opacity: 0; }
  #picker { position: absolute; left: 0; top: 54px; width: 230px; padding: 12px; border-radius: 12px; background: #fff; border: 1px solid var(--line); box-shadow: 0 20px 44px -14px rgba(40,20,100,.35); z-index: 8; opacity: 0; }
  #picker .sv { position: relative; height: 130px; border-radius: 8px; background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, #f07a12); }
  #picker .hue { position: relative; height: 12px; margin-top: 12px; border-radius: 6px; background: linear-gradient(90deg, red, #ff0, lime, cyan, blue, #f0f, red); }
  #picker .hd2 { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .styles { display: flex; gap: 8px; }
  .styles span { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 17px; color: var(--ink-2); }
  .styles span.on { border: 2px solid var(--violet-500); background: var(--violet-100); color: var(--violet-700); }
  .opts { display: flex; gap: 8px; align-items: center; }
  .opts span { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); font-size: 14.5px; font-weight: 600; }
  .opts span.on { background: var(--violet-100); border-color: var(--violet-300); color: var(--violet-700); }
  .back3 { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 14px; }
  #pv-wrap { position: absolute; right: 0; top: 0; width: 440px; display: flex; flex-direction: column; align-items: center; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #f1f0f5; font-size: 14.5px; font-weight: 600; }
  .seg span { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 7px; color: var(--muted); }
  .seg span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .pvcap { margin-top: 12px; font-size: 14px; color: var(--violet-600); font-weight: 600; }

  /* ---------- phones ---------- */
  .phone { position: relative; width: 380px; height: 790px; border-radius: 60px; background: #17141f; padding: 12px; box-shadow: 0 40px 80px -30px rgba(40,20,90,.55), inset 0 0 0 2px #3a3646; }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: #fff; }
  .phone .island { position: absolute; left: 50%; top: 12px; width: 112px; height: 32px; margin-left: -56px; border-radius: 20px; background: #000; z-index: 5; }
  .sbar { position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font-size: 16px; font-weight: 650; z-index: 4; }
  .sbar span { display: flex; gap: 6px; align-items: center; font-size: 15px; }
  .pv-head { display: flex; align-items: center; justify-content: space-between; padding: 64px 20px 14px; font-size: 30px; font-weight: 750; }
  .pv-head span { width: 34px; height: 34px; border-radius: 50%; background: #f1f0f5; display: grid; place-items: center; font-size: 18px; }

  /* pass (carte Wallet) */
  .pass { --pass-bg: #654a98; --pass-fg: #ffffff; position: relative; width: 332px; height: 436px; margin: 0 auto; perspective: 1400px; }
  .pass .flip { position: absolute; inset: 0; transform-style: preserve-3d; }
  .pass .face { position: absolute; inset: 0; border-radius: 18px; background: var(--pass-bg); color: var(--pass-fg); padding: 18px 20px; backface-visibility: hidden; box-shadow: 0 16px 34px -16px rgba(0,0,0,.45); }
  .pass .face.back { transform: rotateY(180deg); }
  .pass .top { display: flex; align-items: center; gap: 10px; }
  .pass .top img { width: 40px; height: 40px; border-radius: 50%; }
  .pass .top b { font-size: 18px; font-weight: 700; }
  .pass .prog { margin-left: auto; text-align: right; }
  .pass .prog small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; opacity: .75; }
  .pass .prog em { font-style: normal; font-size: 24px; font-weight: 800; }
  .pass .prog em sub { font-size: 13px; vertical-align: baseline; }
  .stamps { display: grid; grid-template-columns: repeat(5, 48px); justify-content: space-between; row-gap: 14px; margin-top: 18px; }
  .stp { position: relative; width: 48px; height: 48px; border-radius: 50%; background: #fdf6ec; display: grid; place-items: center; font-size: 22px; color: #1d1a2e; }
  .stp > span { position: absolute; display: grid; place-items: center; opacity: 0; }
  .stp.f .ic-star { opacity: 1; }
  .pass .mem { margin-top: 18px; }
  .pass .mem small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; opacity: .75; }
  .pass .mem b { font-size: 16px; }
  .pass .code { position: absolute; left: 50%; bottom: 20px; width: 160px; margin-left: -80px; padding: 10px 10px 6px; border-radius: 12px; background: #fff; text-align: center; }
  .pass .code .cv { position: relative; height: 128px; }
  .pass .code .cv > * { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .pass .code small { display: block; margin-top: 4px; font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: .12em; color: #555; }
  .pass .brow { padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--pass-fg) 22%, transparent); }
  .pass .brow small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; opacity: .7; }
  .pass .brow b { display: block; min-height: 22px; margin-top: 4px; font-size: 16px; font-weight: 600; }

  /* ---------- modal de création ---------- */
  #shade { position: absolute; inset: 0; background: rgba(22,16,44,.55); opacity: 0; z-index: 20; border-radius: 26px; }
  #modal { position: absolute; left: 330px; top: 150px; width: 960px; z-index: 21; padding: 30px 34px 26px; border-radius: 20px; background: #fff; box-shadow: 0 40px 90px -30px rgba(20,10,60,.6); opacity: 0; }
  #modal h2 { font-size: 23px; font-weight: 750; }
  .stepper { display: flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 15.5px; color: #8a86a0; }
  .stepper .s { display: flex; align-items: center; gap: 9px; }
  .stepper .c { position: relative; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #f1f0f5; font-size: 13px; font-weight: 700; }
  .stepper .c .ico { position: absolute; opacity: 0; font-size: 15px; color: var(--violet-600); }
  .stepper .s.on { color: var(--ink); font-weight: 600; }
  .stepper .s.on .c { background: var(--violet-600); color: #fff; }
  .stepper .s.done .c { background: var(--violet-100); color: transparent; }
  .stepper .s.done .c .ico { opacity: 1; }
  .stepper .dash { width: 22px; height: 1.5px; background: #dedbe8; }
  .mbody { position: relative; height: 470px; margin-top: 24px; overflow: hidden; }
  .mstep { position: absolute; inset: 0; opacity: 0; }
  .mstep h3 { font-size: 19px; font-weight: 700; }
  .mstep .d { margin-top: 6px; color: var(--muted); font-size: 15.5px; }
  .mcols { display: grid; grid-template-columns: 1fr 300px; gap: 30px; margin-top: 22px; }
  .illu { height: 300px; border-radius: 14px; background: #f7f6fa; display: grid; place-items: center; }
  .mech { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 20px; }
  .mc { position: relative; height: 330px; padding: 16px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; box-shadow: 0 0 0 0 rgba(90,49,176,0); }
  #w-pass { --pass-bg: #E2842C; --pass-fg: #1d1a2e; }
  #w-pass .stp.f .ic-star { opacity: 0; }
  #w-pass .stp.f .ic-gift { opacity: 1; }
  .mc .im { height: 150px; display: grid; place-items: center; }
  .mc .im img { max-height: 140px; max-width: 220px; }
  .mc b { display: block; margin-top: 8px; font-size: 18px; }
  .mc .flow { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding: 10px; border-radius: 10px; background: #f8f7fb; font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
  .mc .flow .dt { width: 18px; height: 18px; border-radius: 50%; background: var(--violet-300); }
  .mc .flow .tag { margin-left: auto; padding: 3px 7px; border-radius: 6px; background: #ebe9f1; font-size: 11px; letter-spacing: .05em; }
  .mc .flow .tag.v { background: var(--violet-600); color: #fff; }
  .mc p { margin-top: 10px; font-size: 14px; color: var(--ink-2); line-height: 1.4; }
  .mc .sel { position: absolute; inset: -1.5px; border-radius: 16px; border: 2.5px solid var(--violet-600); background: rgba(124,85,219,.06); opacity: 0; }
  .scope { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  .sc { position: relative; padding: 18px; border-radius: 14px; border: 1.5px solid var(--line); }
  .sc b { display: block; margin-top: 8px; font-size: 16.5px; }
  .sc small { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }
  .sc .sel { position: absolute; inset: -1.5px; border-radius: 14px; border: 2.5px solid var(--violet-600); background: rgba(124,85,219,.06); opacity: 0; }
  .sum div { display: flex; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
  .sum small { font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
  .next-hint { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--violet-50); color: var(--violet-700); font-size: 15px; font-weight: 500; }
  .mfoot { display: flex; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--line); }
  .mfoot .stepn { margin-right: auto; color: var(--muted); font-size: 15px; }
  .swapb { position: relative; display: inline-grid; }
  .swapb > * { grid-area: 1 / 1; }

  /* ---------- toast, confettis ---------- */
  .toast { position: absolute; right: 40px; top: 96px; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 14px; background: #fff; border: 1px solid var(--line); box-shadow: 0 20px 44px -16px rgba(40,20,100,.35); font-size: 16px; font-weight: 600; opacity: 0; }
  .toast .ok { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #16a34a; color: #fff; font-size: 17px; }
  .confetti { position: absolute; width: 0; height: 0; z-index: 40; }
  .confetti i { position: absolute; width: 12px; height: 7px; border-radius: 2px; opacity: 0; }

  /* ---------- relances ---------- */
  .rcard { padding: 22px 24px; }
  .rcard .hd { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
  .rcard .hd .ic-box { width: 36px; height: 36px; font-size: 17px; }
  .rcard .ds { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; color: var(--ink-2); flex-wrap: wrap; }
  .r3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
  .rt { display: flex; gap: 14px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; }
  .rt .ic-box { width: 40px; height: 40px; font-size: 18px; }
  .rt b { display: block; font-size: 16px; }
  .rt small { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); line-height: 1.35; }
  .rt .sw { margin-left: auto; }
  .info3 { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fafafc; font-size: 14.5px; color: var(--ink-2); }
  .ok-line { margin-top: 8px; font-size: 14px; font-weight: 600; color: #16a34a; opacity: 0; }

  /* ---------- scènes hors interface ---------- */
  .scene { position: absolute; }

  const icon = (n, cls = '') => (cls ? `<span class="${cls}"><i data-icon="${n}"></i></span>` : `<i data-icon="${n}"></i>`);

  // QR code et code-barres décoratifs (motifs aléatoires, non scannables)
  const qrSvg = (size = 150, seed = 7, n = 25) => {
    let s = seed;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const c = size / n;
    let cells = '';
    const inF = (i, j) => (i < 8 && j < 8) || (i >= n - 8 && j < 8) || (i < 8 && j >= n - 8);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (!inF(i, j) && rnd() < 0.5) cells += `<rect x="${(i * c).toFixed(2)}" y="${(j * c).toFixed(2)}" width="${(c + 0.4).toFixed(2)}" height="${(c + 0.4).toFixed(2)}"/>`;
    const f = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" rx="${c}"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}"/>`;
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><g fill="#111">${cells}${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}</g></svg>`;
  };
  const barSvg = (w = 150, h = 80, seed = 3) => {
    let s = seed;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    let x = 0;
    let bars = '';
    while (x < w - 4) {
      const bw = 1 + Math.floor(rnd() * 3.5);
      if (rnd() < 0.55) bars += `<rect x="${x}" y="0" width="${bw}" height="${h}"/>`;
      x += bw + 1;
    }
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><g fill="#111">${bars}</g></svg>`;
  };

  // ================================================================ OUTRO
  M.camera({ x: 1500, y: 900, s: 0.45 }, outro.start + 0.4, { dur: 1.2, whoosh: true });
  const end = M.titleCard(`<div class="logo">${M.logo({ h: 230 })}</div><div class="tagline">Vos clients fidèles, directement dans leur poche !</div>`);
  const tEnd = outro.audio.start - 0.6;
  M.sfx('sting', tEnd);
  tl.to(end, { opacity: 1, duration: 0.6, ease: 'power2.out' }, tEnd);
  tl.from(end.querySelector('.logo'), { y: 30, scale: 0.94, duration: 0.8, ease: 'power3.out' }, tEnd + 0.05);
  tl.from(end.querySelector('.gl-icon'), { rotate: -90, scale: 0.4, duration: 1.1, ease: 'back.out(1.7)' }, tEnd + 0.05);
  tl.from(end.querySelector('.tagline'), { opacity: 0, y: 20, duration: 0.6, ease: 'power3.out' }, outro.audio.start);

  M.ready();
})();
</script>
</body>
</html>
